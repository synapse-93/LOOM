[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loom"
version = "0.1.0"
description = "VIDEO2PRINT: Smartphone Video to Metrically Scaled, Validated, 3D Printable Object"
readme = "README.md"
requires-python = ">=3.10, <3.11"
license = { text = "MIT" }
authors = [
    { name = "LOOM Architecture Team" }
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
loom = "loom.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
